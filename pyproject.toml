[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcc"
version = "1.0.0"
description = "Optimistic and pessimistic consistency control for language-model agents in adaptive assessment"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Oleksandr Kholodniak" }]
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.6",
    "rank-bm25==0.2.2",
    "requests==2.32.3",
    "matplotlib==3.10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
agentcc = "agentcc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/agentcc/agents.py" = ["E501"]
